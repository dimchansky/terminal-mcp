<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>terminal-mcp activity</title>
<link rel="stylesheet" href="/dashboard/app.css">
<script type="module" src="/dashboard/app.js"></script>
</head>
<body>
<section id="login" class="gate" hidden>
<h1>terminal-mcp activity</h1>
<p>Run <code>terminal-mcp dashboard</code> in your terminal and enter the one-time code it prints.</p>
<label for="code">One-time code</label>
<input id="code" type="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" inputmode="text">
<button id="submit" type="button">Sign in</button>
<p id="login-error" role="alert"></p>
</section>
<section id="offline" class="gate" hidden>
<p id="offline-reason" role="alert"></p>
<button id="retry" type="button">Retry</button>
</section>
<section id="ended" class="gate" hidden>
<p id="ended-reason" role="alert"></p>
<button id="again" type="button">Sign in again</button>
</section>
<div id="signed-in" class="app" hidden>
<header class="bar">
<button id="chats-toggle" class="chats-toggle" type="button" aria-controls="lanes" aria-expanded="false">Chats<span id="chats-unread"></span></button>
<h1>terminal-mcp activity</h1>
<span id="connection" class="connection" role="status" aria-live="polite"></span>
<div id="warnings" class="warnings" role="status"></div>
<div class="auto-group"><label class="auto"><input id="auto-switch" type="checkbox"> Auto-switch chats</label><span id="pending"></span></div>
<div class="session"><span id="status"></span><button id="logout" type="button">Sign out</button></div>
</header>
<nav id="lanes" class="lanes" aria-label="Conversations">
<div class="lanes-actions"><button id="discover" type="button">Discover older conversations</button></div>
<input id="lane-search" class="lane-search" type="search" placeholder="Search chats" aria-label="Search chats by alias, client name or ID" aria-controls="lane-list" autocomplete="off" spellcheck="false">
<div role="status"><p id="lanes-hidden" class="lanes-hidden" hidden><span id="lanes-hidden-text"></span> <button id="lane-search-clear" type="button">Clear</button></p></div>
<ul id="lane-list" role="listbox" aria-label="Conversations"></ul>
<p class="hint">Chat names come from client metadata and are not verified. "Last:" shows the newest loaded action, not a chat title.</p>
</nav>
<main id="timeline-wrap" class="timeline-wrap">
<div id="lane-title" class="lane-title"></div>
<div id="filters" class="filters" role="search" aria-label="Search and filter this chat's loaded history">
<input id="filter-query" type="search" placeholder="Search loaded history" aria-label="Search loaded history" autocomplete="off" spellcheck="false">
<span id="filter-tools" class="filter-tools" role="group" aria-label="Action types"></span>
<button id="filter-attention" type="button" aria-pressed="false">Needs attention</button>
<button id="filter-reset" type="button" hidden>Reset</button>
<div id="filter-status" class="filter-status" role="status"></div>
</div>
<div id="timeline" class="timeline" tabindex="-1"></div>
<button id="jump" class="jump" type="button" hidden>Jump to latest</button>
</main>
</div>
</body>
</html>
