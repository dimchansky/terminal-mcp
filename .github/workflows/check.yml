name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # make check also validates go.mod and go.sum without changing them.
      - run: make check

  windows:
    name: Windows native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify, test and build Windows
        shell: pwsh
        run: |
          go mod verify
          go mod tidy -diff
          go test -race -count=1 -timeout=180s ./...
          go vet ./...
          go build -trimpath -o terminal-mcp.exe ./cmd/terminal-mcp
          $env:GOARCH = 'arm64'
          go build -trimpath -o terminal-mcp-arm64.exe ./cmd/terminal-mcp

  quality:
    name: Lint and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: --timeout=5m
      - run: make vulncheck
